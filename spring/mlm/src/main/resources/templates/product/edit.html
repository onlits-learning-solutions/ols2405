<!DOCTYPE html>
<html lang="en">

<head th:replace="~{layout/head :: head('MLM - Edit Product')}"></head>

<body class="container mt-3">
    <header th:replace="~{layout/header}"></header>
    <h3 class="mt-3">Edit Product</h3>
    <form th:action="@{'/product/edit/' + ${product.id}}" method="post">
        <label for="id" class="for-label">Id</label>
        <input type="text" id="id" name="id" class="form-control mb-3" th:value="${product.id}">
        <label for="name" class="form-label">Name</label>
        <input type="text" name="name" id="name" class="form-control mb-3" th:value="${product.name}">
        <label for="description" class="form-label">Description</label>
        <input type="text" name="description" id="description" class="form-control mb-3"
            th:value="${product.description}">
        <button class="btn btn-primary">Submit</button>
    </form>
    <footer th:replace="~{layout/footer}"></footer>
</body>

</html>
