<!DOCTYPE html>
<html lang="en">

<head th:replace="~{layout/head :: head('MLM - Product')}"></head>

<body class="container mt-3">
    <header th:replace="~{layout/header}"></header>
    <div class="float-end"><a href="/product/create" class="btn btn-primary mt-3">Create</a></div>
    <h3 class="mt-3">Products</h3>
    <table class="table">
        <tr>
            <th>Id</th>
            <th>Name</th>
            <th>Description</th>
            <th></th>
            <th></th>
        </tr>
        <tr th:each="product : ${products}">
            <td th:text="${product.id}"></td>
            <td th:text="${product.name}"></td>
            <td th:text="${product.description}"></td>
            <td><a th:text="Edit" th:href="@{'/product/edit/' + ${product.id}}"></a></td>
            <td><a th:text="Delete" th:href="@{'/product/delete/' + ${product.id}}"></a></td>
        </tr>
    </table>
    <footer th:replace="~{layout/footer}"></footer>

</body>

</html>
