<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLM - Product</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body class="container mt-3">
    <header th:insert="layout/header"></header>
    <div class="float-end"><a href="/product/create" class="btn btn-primary mt-3">Create</a></div>
    <h3 class="mt-3">Products</h3>
    <table class="table">
        <tr>
            <th>Id</th>
            <th>Name</th>
            <th>Description</th>
            <th></th>
            <th></th>
        </tr>
        <tr th:each="product : ${products}">
            <td th:text="${product.id}"></td>
            <td th:text="${product.name}"></td>
            <td th:text="${product.description}"></td>
            <td><a th:text="Edit" th:href="@{'/product/edit/' + ${product.id}}"></a></td>
            <td><a th:text="Delete" th:href="@{'/product/delete/' + ${product.id}}"></a></td>
        </tr>
    </table>
    <footer th:insert="layout/footer"></footer>

</body>

</html>
