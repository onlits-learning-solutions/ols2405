<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLM - Product</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body class="container mt-3">
    <header th:insert="~{layout/header}"></header>
    <div class="float-end"><a href="/unit/create" class="btn btn-primary mt-3">Create</a></div>
    <h3 class="mt-3">Products</h3>
    <table class="table">
        <tr>
            <th>Unit</th>
            <th>Name</th>
            <th></th>
            <th></th>
        </tr>
        <tr th:each="unit : ${units}">
            <td th:text="${unit.unit}"></td>
            <td th:text="${unit.name}"></td>
            <td><a th:text="Edit" th:href="@{'/unit/edit/' + ${unit.unit}}"></a></td>
            <td><a th:text="Delete" th:href="@{'/unit/delete/' + ${unit.unit}}"></a></td>
        </tr>
    </table>
    <footer th:insert="~{layout/footer}"></footer>

</body>

</html>
